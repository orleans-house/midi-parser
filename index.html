<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDI Parser & TAB Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #00d4ff;
      margin-bottom: 24px;
      font-size: 1.6rem;
    }

    h2 {
      color: #00d4ff;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    /* ドロップゾーン */
    #drop-zone {
      border: 2px dashed #444;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 24px;
      background: #16213e;
    }

    #drop-zone.dragover {
      border-color: #00d4ff;
      background: #1a2a4a;
    }

    #drop-zone p {
      font-size: 1rem;
      color: #888;
    }

    #drop-zone .hint {
      font-size: 0.8rem;
      color: #555;
      margin-top: 8px;
    }

    #file-input { display: none; }

    /* ヘッダー情報 */
    #header-info {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      display: none;
    }

    #header-info table {
      width: 100%;
    }

    #header-info td {
      padding: 4px 12px;
    }

    #header-info td:first-child {
      color: #888;
      width: 180px;
    }

    /* コントロール */
    #controls {
      display: none;
      gap: 12px;
      margin-bottom: 24px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background: #00d4ff;
      color: #1a1a2e;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover { background: #00b8d9; }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }

    select {
      background: #16213e;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 10px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #tempo-display, #position-display {
      color: #888;
      font-size: 0.85rem;
    }

    /* チャンネルビジュアライザー */
    #visualizer-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .channel-card {
      background: #16213e;
      border-radius: 8px;
      padding: 10px;
      border: 1px solid #333;
    }

    .channel-card canvas {
      height: 80px;
    }

    .channel-card.channel-inactive {
      opacity: 0.4;
    }

    .channel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .channel-label {
      font-weight: bold;
      font-size: 0.85rem;
      flex: 1;
    }

    .btn-ch {
      width: 28px;
      height: 28px;
      padding: 0;
      font-size: 0.7rem;
      border-radius: 4px;
      background: #2a2a4a;
      color: #888;
      border: 1px solid #444;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.15s, color 0.15s;
    }

    .btn-ch:hover {
      background: #3a3a5a;
      color: #ccc;
    }

    .btn-mute.active {
      background: #e03131;
      color: #fff;
      border-color: #e03131;
    }

    .btn-solo.active {
      background: #f59f00;
      color: #1a1a2e;
      border-color: #f59f00;
    }

    /* フィルターバー */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .filter-bar label {
      color: #888;
      font-size: 0.85rem;
    }

    .filter-bar select {
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    /* 可視化セクション */
    .viz-section {
      display: none;
      margin-bottom: 24px;
    }

    .viz-section h2 {
      color: #00d4ff;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .viz-section canvas {
      width: 100%;
      border-radius: 4px;
      background: #0d1117;
      display: block;
      cursor: crosshair;
    }

    #piano-roll-section {
      background: #16213e;
      border-radius: 8px;
      padding: 10px;
      border: 1px solid #333;
    }

  </style>
</head>
<body>
  <!-- <h1>MIDI Parser & TAB Generator</h1> -->

  <div id="drop-zone">
    <p>MIDIファイルをドラッグ&ドロップ</p>
    <p class="hint">またはクリックしてファイルを選択</p>
    <input type="file" id="file-input" accept=".mid,.midi">
  </div>

  <div id="header-info" style="display:none;">
    <h2>MIDIヘッダー</h2>
    <table>
      <tr><td>フォーマット</td><td id="info-format">-</td></tr>
      <tr><td>トラック数</td><td id="info-tracks">-</td></tr>
      <tr><td>タイムディビジョン</td><td id="info-division">-</td></tr>
      <tr><td>テンポ</td><td id="info-tempo">-</td></tr>
      <tr><td>ノート数</td><td id="info-notes">-</td></tr>
    </table>
  </div>

  <div id="visualizer-section" style="display:none; margin-bottom: 20px;">
    <!-- <h2>波形（チャンネル別）</h2> -->
    <div id="visualizer-container"></div>
  </div>

  <div id="controls">
    <button id="btn-play">&#9654; 再生</button>
    <button id="btn-stop" disabled>&#9632; 停止</button>
    <select id="wave-type">
      <option value="triangle">🔺 Triangle</option>
      <option value="sine">🔵 Sine</option>
      <option value="square">🟧 Square</option>
      <option value="sawtooth">🔶 Sawtooth</option>
    </select>
    <span id="tempo-display"></span>
    <span id="position-display"></span>
  </div>

  <!-- Piano Roll -->
  <div id="piano-roll-section" class="viz-section">
    <canvas id="piano-roll-canvas" width="1200" height="300"></canvas>
  </div>

  <script>
    // ============================================================
    // MIDI バイナリパーサー
    // ============================================================

    class MidiParser {
      constructor(buffer) {
        this.data = new DataView(buffer);
        this.pos = 0;
      }

      // 読み取りヘルパー
      readUint8() { return this.data.getUint8(this.pos++); }
      readUint16() { const v = this.data.getUint16(this.pos); this.pos += 2; return v; }
      readUint32() { const v = this.data.getUint32(this.pos); this.pos += 4; return v; }
      readBytes(n) {
        const arr = new Uint8Array(this.data.buffer, this.pos, n);
        this.pos += n;
        return arr;
      }

      // 可変長数値
      readVarLen() {
        let value = 0;
        for (let i = 0; i < 4; i++) {
          const b = this.readUint8();
          value = (value << 7) | (b & 0x7f);
          if ((b & 0x80) === 0) break;
        }
        return value;
      }

      // チャンク識別子を文字列で読む
      readChunkId() {
        return String.fromCharCode(...this.readBytes(4));
      }

      parse() {
        // ヘッダーチャンク
        const headerId = this.readChunkId();
        if (headerId !== 'MThd') throw new Error('MIDIファイルではありません');
        const headerLen = this.readUint32();
        const format = this.readUint16();
        const numTracks = this.readUint16();
        const timeDivision = this.readUint16();

        // ティックベースの場合のデフォルトテンポ（120 BPM = 500000 μs/beat）
        const ticksPerBeat = (timeDivision & 0x8000) === 0 ? timeDivision : 480;

        const header = { format, numTracks, timeDivision, ticksPerBeat };
        const tracks = [];

        for (let t = 0; t < numTracks; t++) {
          const trackId = this.readChunkId();
          const trackLen = this.readUint32();
          if (trackId !== 'MTrk') {
            // 不明なチャンクはスキップ
            this.pos += trackLen;
            continue;
          }
          const trackEnd = this.pos + trackLen;
          const events = [];
          let runningStatus = 0;

          try {
          while (this.pos < trackEnd) {
            const delta = this.readVarLen();
            let statusByte = this.data.getUint8(this.pos);

            // ランニングステータス
            if (statusByte < 0x80) {
              statusByte = runningStatus;
            } else {
              this.pos++;
              if (statusByte < 0xf0) runningStatus = statusByte;
            }

            const type = statusByte & 0xf0;
            const channel = statusByte & 0x0f;

            if (statusByte === 0xff) {
              // メタイベント
              const metaType = this.readUint8();
              const len = this.readVarLen();
              const metaData = this.readBytes(len);
              events.push({ delta, type: 'meta', metaType, data: metaData });
            } else if (statusByte === 0xf0 || statusByte === 0xf7) {
              // SysExイベント
              const len = this.readVarLen();
              this.pos += len;
              events.push({ delta, type: 'sysex' });
            } else if (type === 0x90) {
              // Note On
              const note = this.readUint8();
              const velocity = this.readUint8();
              events.push({ delta, type: 'noteOn', channel, note, velocity });
            } else if (type === 0x80) {
              // Note Off
              const note = this.readUint8();
              const velocity = this.readUint8();
              events.push({ delta, type: 'noteOff', channel, note, velocity });
            } else if (type === 0xa0 || type === 0xb0 || type === 0xe0) {
              // Aftertouch, CC, Pitch Bend (2バイト)
              this.readUint8();
              this.readUint8();
              events.push({ delta, type: 'other' });
            } else if (type === 0xc0) {
              // Program Change (1バイト)
              const program = this.readUint8();
              events.push({ delta, type: 'programChange', channel, program });
            } else if (type === 0xd0) {
              // Channel Pressure (1バイト)
              this.readUint8();
              events.push({ delta, type: 'other' });
            } else {
              // 未知のイベントはスキップ（1バイト消費して進む）
              this.pos++;
              events.push({ delta, type: 'unknown' });
            }
          }
          } catch (e) {
            console.warn(`Track ${t} parse error:`, e.message);
          }
          this.pos = trackEnd;
          tracks.push(events);
        }

        return { header, tracks };
      }
    }

    // ============================================================
    // MIDI データ → ノートリスト変換
    // ============================================================

    function extractNotes(parsed) {
      const { header, tracks } = parsed;
      const ticksPerBeat = header.ticksPerBeat;
      let tempo = 500000; // デフォルト 120 BPM
      const allNotes = [];

      // テンポマップを構築（全トラックから収集）
      const tempoMap = [];
      for (const events of tracks) {
        let tick = 0;
        for (const e of events) {
          tick += e.delta;
          if (e.type === 'meta' && e.metaType === 0x51 && e.data.length === 3) {
            const t = (e.data[0] << 16) | (e.data[1] << 8) | e.data[2];
            tempoMap.push({ tick, tempo: t });
          }
        }
      }
      tempoMap.sort((a, b) => a.tick - b.tick);
      if (tempoMap.length > 0) tempo = tempoMap[0].tempo;

      // ティック → 秒変換
      function tickToSec(targetTick) {
        let currentTempo = tempoMap.length > 0 ? tempoMap[0].tempo : 500000;
        let lastTick = 0;
        let time = 0;
        for (const tm of tempoMap) {
          if (tm.tick >= targetTick) break;
          time += ((tm.tick - lastTick) / ticksPerBeat) * (currentTempo / 1000000);
          lastTick = tm.tick;
          currentTempo = tm.tempo;
        }
        time += ((targetTick - lastTick) / ticksPerBeat) * (currentTempo / 1000000);
        return time;
      }

      // 各トラックからノートを抽出
      for (const events of tracks) {
        let tick = 0;
        const activeNotes = new Map(); // key: "ch-note"

        for (const e of events) {
          tick += e.delta;

          if (e.type === 'noteOn' && e.velocity > 0) {
            const key = `${e.channel}-${e.note}`;
            activeNotes.set(key, { tick, channel: e.channel, note: e.note, velocity: e.velocity });
          } else if (e.type === 'noteOff' || (e.type === 'noteOn' && e.velocity === 0)) {
            const key = `${e.channel}-${e.note}`;
            const start = activeNotes.get(key);
            if (start) {
              allNotes.push({
                channel: start.channel,
                note: start.note,
                velocity: start.velocity,
                startTick: start.tick,
                endTick: tick,
                startTime: tickToSec(start.tick),
                duration: tickToSec(tick) - tickToSec(start.tick),
              });
              activeNotes.delete(key);
            }
          }
        }
      }

      // 時間順ソート
      allNotes.sort((a, b) => a.startTime - b.startTime || a.note - b.note);

      const bpm = Math.round(60000000 / tempo);
      return { notes: allNotes, tempo, bpm };
    }

    // ============================================================
    // 音名変換
    // ============================================================

    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    function noteName(midiNote) {
      const octave = Math.floor(midiNote / 12) - 1;
      return NOTE_NAMES[midiNote % 12] + octave;
    }

    // ============================================================
    // General MIDI 音色マップ（128種類）
    // ============================================================

    const GM_INSTRUMENTS = [
      // Piano (0-7)
      'Acoustic Grand Piano', 'Bright Acoustic Piano', 'Electric Grand Piano', 'Honky-tonk Piano',
      'Electric Piano 1', 'Electric Piano 2', 'Harpsichord', 'Clavinet',
      // Chromatic Percussion (8-15)
      'Celesta', 'Glockenspiel', 'Music Box', 'Vibraphone',
      'Marimba', 'Xylophone', 'Tubular Bells', 'Dulcimer',
      // Organ (16-23)
      'Drawbar Organ', 'Percussive Organ', 'Rock Organ', 'Church Organ',
      'Reed Organ', 'Accordion', 'Harmonica', 'Tango Accordion',
      // Guitar (24-31)
      'Acoustic Guitar (nylon)', 'Acoustic Guitar (steel)', 'Electric Guitar (jazz)', 'Electric Guitar (clean)',
      'Electric Guitar (muted)', 'Overdriven Guitar', 'Distortion Guitar', 'Guitar Harmonics',
      // Bass (32-39)
      'Acoustic Bass', 'Electric Bass (finger)', 'Electric Bass (pick)', 'Fretless Bass',
      'Slap Bass 1', 'Slap Bass 2', 'Synth Bass 1', 'Synth Bass 2',
      // Strings (40-47)
      'Violin', 'Viola', 'Cello', 'Contrabass',
      'Tremolo Strings', 'Pizzicato Strings', 'Orchestral Harp', 'Timpani',
      // Ensemble (48-55)
      'String Ensemble 1', 'String Ensemble 2', 'Synth Strings 1', 'Synth Strings 2',
      'Choir Aahs', 'Voice Oohs', 'Synth Choir', 'Orchestra Hit',
      // Brass (56-63)
      'Trumpet', 'Trombone', 'Tuba', 'Muted Trumpet',
      'French Horn', 'Brass Section', 'Synth Brass 1', 'Synth Brass 2',
      // Reed (64-71)
      'Soprano Sax', 'Alto Sax', 'Tenor Sax', 'Baritone Sax',
      'Oboe', 'English Horn', 'Bassoon', 'Clarinet',
      // Pipe (72-79)
      'Piccolo', 'Flute', 'Recorder', 'Pan Flute',
      'Blown Bottle', 'Shakuhachi', 'Whistle', 'Ocarina',
      // Synth Lead (80-87)
      'Lead 1 (square)', 'Lead 2 (sawtooth)', 'Lead 3 (calliope)', 'Lead 4 (chiff)',
      'Lead 5 (charang)', 'Lead 6 (voice)', 'Lead 7 (fifths)', 'Lead 8 (bass + lead)',
      // Synth Pad (88-95)
      'Pad 1 (new age)', 'Pad 2 (warm)', 'Pad 3 (polysynth)', 'Pad 4 (choir)',
      'Pad 5 (bowed)', 'Pad 6 (metallic)', 'Pad 7 (halo)', 'Pad 8 (sweep)',
      // Synth Effects (96-103)
      'FX 1 (rain)', 'FX 2 (soundtrack)', 'FX 3 (crystal)', 'FX 4 (atmosphere)',
      'FX 5 (brightness)', 'FX 6 (goblins)', 'FX 7 (echoes)', 'FX 8 (sci-fi)',
      // Ethnic (104-111)
      'Sitar', 'Banjo', 'Shamisen', 'Koto',
      'Kalimba', 'Bagpipe', 'Fiddle', 'Shanai',
      // Percussive (112-119)
      'Tinkle Bell', 'Agogo', 'Steel Drums', 'Woodblock',
      'Taiko Drum', 'Melodic Tom', 'Synth Drum', 'Reverse Cymbal',
      // Sound Effects (120-127)
      'Guitar Fret Noise', 'Breath Noise', 'Seashore', 'Bird Tweet',
      'Telephone Ring', 'Helicopter', 'Applause', 'Gunshot',
    ];

    function getInstrumentName(program) {
      return GM_INSTRUMENTS[program] || `Program ${program}`;
    }

    // チャンネルごとのプログラム番号（楽器）
    let channelPrograms = {};

    function extractChannelPrograms(parsed) {
      const programs = {};
      for (const events of parsed.tracks) {
        for (const e of events) {
          if (e.type === 'programChange') {
            programs[e.channel] = e.program;
          }
        }
      }
      return programs;
    }

    function midiToFreq(midiNote) {
      return 440 * Math.pow(2, (midiNote - 69) / 12);
    }

    // ============================================================
    // ============================================================
    // チャンネル管理
    // ============================================================

    const CHANNEL_COLORS = [
      '#00d4ff', '#ff6b6b', '#51cf66', '#ffd43b',
      '#cc5de8', '#ff922b', '#20c997', '#748ffc',
      '#f06595', '#94d82d', '#22b8cf', '#ff8787',
      '#69db7c', '#ffa94d', '#da77f2', '#5c7cfa'
    ];

    let channelStates = {}; // { [ch]: { muted, soloed, gainNode, analyser } }
    let currentChannels = [];

    function getChannelLabel(ch) {
      const num = ch + 1;
      if (num === 10) return 'Ch.10 (Drums)';
      const program = channelPrograms[ch];
      if (program !== undefined) {
        return `Ch.${num} - ${getInstrumentName(program)}`;
      }
      return `Ch.${num}`;
    }

    function getChannelColor(ch) {
      return CHANNEL_COLORS[ch % CHANNEL_COLORS.length];
    }

    function detectChannels(notes) {
      const channels = new Set();
      for (const n of notes) channels.add(n.channel);
      return [...channels].sort((a, b) => a - b);
    }

    function buildChannelUI(channels) {
      const container = document.getElementById('visualizer-container');
      container.innerHTML = '';
      channelStates = {};

      // マスター合成波カード（4列幅）
      const masterCard = document.createElement('div');
      masterCard.className = 'channel-card';
      masterCard.style.gridColumn = '1 / -1';
      const masterHeader = document.createElement('div');
      masterHeader.className = 'channel-header';
      const masterLabel = document.createElement('span');
      masterLabel.className = 'channel-label';
      masterLabel.textContent = '🔊 Master';
      masterHeader.append(masterLabel);
      const masterCanvas = document.createElement('canvas');
      masterCanvas.id = 'waveform-master';
      masterCanvas.height = 80;
      masterCanvas.style.width = '100%';
      masterCanvas.style.background = '#0d1117';
      masterCanvas.style.borderRadius = '4px';
      masterCanvas.style.display = 'block';
      masterCard.append(masterHeader, masterCanvas);
      container.appendChild(masterCard);

      // 全16チャンネル表示（0-15）
      const allChannels = Array.from({length: 16}, (_, i) => i);

      for (const ch of allChannels) {
        const isActive = channels.includes(ch);
        channelStates[ch] = { muted: !isActive, soloed: false, gainNode: null, analyser: null, active: isActive };

        const card = document.createElement('div');
        card.className = 'channel-card' + (isActive ? '' : ' channel-inactive');
        card.id = `channel-card-${ch}`;

        const header = document.createElement('div');
        header.className = 'channel-header';

        const label = document.createElement('span');
        label.className = 'channel-label';
        label.style.color = getChannelColor(ch);
        label.textContent = getChannelLabel(ch);

        const btnMute = document.createElement('button');
        btnMute.className = 'btn-ch btn-mute';
        btnMute.textContent = 'M';
        btnMute.title = 'Mute';
        btnMute.addEventListener('click', () => toggleMute(ch));

        const btnSolo = document.createElement('button');
        btnSolo.className = 'btn-ch btn-solo';
        btnSolo.textContent = 'S';
        btnSolo.title = 'Solo';
        btnSolo.addEventListener('click', () => toggleSolo(ch));

        header.append(label, btnMute, btnSolo);

        const canvas = document.createElement('canvas');
        canvas.id = `waveform-${ch}`;
        canvas.height = 80;
        canvas.style.width = '100%';
        canvas.style.background = '#0d1117';
        canvas.style.borderRadius = '4px';
        canvas.style.display = 'block';

        card.append(header, canvas);
        container.appendChild(card);

        // NO SIGNAL表示
        if (!isActive) {
          requestAnimationFrame(() => {
            canvas.width = canvas.offsetWidth;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#333';
            ctx.font = '12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('NO SIGNAL', canvas.width / 2, canvas.height / 2 + 4);
          });
        }
      }
    }

    function toggleMute(ch) {
      const state = channelStates[ch];
      state.muted = !state.muted;
      const btn = document.querySelector(`#channel-card-${ch} .btn-mute`);
      btn.classList.toggle('active', state.muted);
      updateChannelGains();
    }

    function toggleSolo(ch) {
      const state = channelStates[ch];
      state.soloed = !state.soloed;
      const btn = document.querySelector(`#channel-card-${ch} .btn-solo`);
      btn.classList.toggle('active', state.soloed);
      updateChannelGains();
    }

    function updateChannelGains() {
      const anySolo = Object.values(channelStates).some(s => s.soloed);
      for (const [ch, state] of Object.entries(channelStates)) {
        if (!state.gainNode) continue;
        const shouldPlay = anySolo ? (state.soloed && !state.muted) : !state.muted;
        state.gainNode.gain.value = shouldPlay ? 1 : 0;
      }
    }

    // ============================================================
    // Web Audio API 再生
    // ============================================================

    let audioCtx = null;
    let isPlaying = false;
    let scheduledNodes = [];
    let animationTimer = null;
    let schedulerTimer = null;

    async function playNotes(notes, bpm, seekOffset = 0) {
      stopPlayback();
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
      isPlaying = true;
      scheduledNodes = [];

      const masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.5;

      // マスター合成波用AnalyserNode
      const masterAnalyser = audioCtx.createAnalyser();
      masterAnalyser.fftSize = 2048;
      masterGain.connect(masterAnalyser);
      masterAnalyser.connect(audioCtx.destination);
      window._masterAnalyser = masterAnalyser;

      // チャンネルごとのオーディオノード作成
      for (const ch of currentChannels) {
        const state = channelStates[ch];

        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 1;

        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;

        gainNode.connect(analyser);
        analyser.connect(masterGain);

        state.gainNode = gainNode;
        state.analyser = analyser;

        // Canvasサイズ設定
        const canvas = document.getElementById(`waveform-${ch}`);
        if (canvas) canvas.width = canvas.offsetWidth;
      }

      // ミュート/ソロ状態を適用
      updateChannelGains();

      // ビジュアライザー表示
      document.getElementById('visualizer-section').style.display = 'block';

      // 波形描画ループ
      function drawWaveforms() {
        if (!isPlaying) {
          // マスタークリア
          const mc = document.getElementById('waveform-master');
          if (mc) { const mctx = mc.getContext('2d'); mctx.clearRect(0, 0, mc.width, mc.height); }
          for (const ch of currentChannels) {
            const canvas = document.getElementById(`waveform-${ch}`);
            if (canvas) {
              const ctx = canvas.getContext('2d');
              ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
          }
          return;
        }
        requestAnimationFrame(drawWaveforms);

        // マスター合成波描画
        if (window._masterAnalyser) {
          const mc = document.getElementById('waveform-master');
          if (mc) {
            mc.width = mc.offsetWidth;
            const mctx = mc.getContext('2d');
            const ma = window._masterAnalyser;
            const bufLen = ma.frequencyBinCount;
            const data = new Uint8Array(bufLen);
            ma.getByteTimeDomainData(data);
            mctx.fillStyle = '#0d1117';
            mctx.fillRect(0, 0, mc.width, mc.height);
            mctx.lineWidth = 2;
            mctx.strokeStyle = '#00d4ff';
            mctx.beginPath();
            const sw = mc.width / bufLen;
            let mx = 0;
            for (let i = 0; i < bufLen; i++) {
              const v = data[i] / 128.0;
              const y = (v * mc.height) / 2;
              if (i === 0) mctx.moveTo(mx, y); else mctx.lineTo(mx, y);
              mx += sw;
            }
            mctx.lineTo(mc.width, mc.height / 2);
            mctx.stroke();
          }
        }

        for (const ch of currentChannels) {
          const state = channelStates[ch];
          if (!state.analyser) continue;

          const canvas = document.getElementById(`waveform-${ch}`);
          if (!canvas) continue;

          const ctx = canvas.getContext('2d');
          const analyser = state.analyser;
          const bufferLength = analyser.frequencyBinCount;
          const dataArray = new Uint8Array(bufferLength);
          analyser.getByteTimeDomainData(dataArray);

          ctx.fillStyle = '#0d1117';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.lineWidth = 2;
          ctx.strokeStyle = getChannelColor(ch);
          ctx.beginPath();

          const sliceWidth = canvas.width / bufferLength;
          let x = 0;
          for (let i = 0; i < bufferLength; i++) {
            const v = dataArray[i] / 128.0;
            const y = (v * canvas.height) / 2;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
            x += sliceWidth;
          }
          ctx.lineTo(canvas.width, canvas.height / 2);
          ctx.stroke();
        }
      }
      drawWaveforms();

      const startOffset = audioCtx.currentTime + 0.1;

      // AudioContext時間ベースの先読みスケジューラ
      const LOOK_AHEAD = 15;
      const CHECK_INTERVAL = 200;
      let chunkIndex = 0;

      function scheduler() {
        if (!isPlaying || !audioCtx) return;
        const horizon = audioCtx.currentTime + LOOK_AHEAD;

        while (chunkIndex < notes.length) {
          const t = startOffset + notes[chunkIndex].startTime;
          if (t > horizon) break;

          const n = notes[chunkIndex];
          const freq = midiToFreq(n.note);
          const dur = Math.max(n.duration, 0.05);

          const osc = audioCtx.createOscillator();
          const env = audioCtx.createGain();

          osc.type = document.getElementById('wave-type').value;
          osc.frequency.value = freq;

          const vel = n.velocity / 127;
          env.gain.setValueAtTime(0, t);
          env.gain.linearRampToValueAtTime(vel * 0.15, t + 0.01);
          env.gain.setValueAtTime(vel * 0.15, t + dur - Math.min(0.05, dur * 0.3));
          env.gain.linearRampToValueAtTime(0, t + dur);

          osc.connect(env);

          // チャンネル別ゲインノードにルーティング
          const chState = channelStates[n.channel];
          if (chState && chState.gainNode) {
            env.connect(chState.gainNode);
          } else {
            env.connect(masterGain);
          }

          osc.start(t);
          osc.stop(t + dur + 0.01);

          scheduledNodes.push(osc);
          chunkIndex++;
        }

        if (chunkIndex < notes.length && isPlaying) {
          schedulerTimer = setTimeout(scheduler, CHECK_INTERVAL);
        }
      }

      scheduler();

      // 再生終了検知
      const totalDuration = notes.length > 0
        ? Math.max(...notes.map(n => n.startTime + n.duration))
        : 0;

      if (seekOffset === 0) currentTotalDuration = totalDuration;

      btnPlay.disabled = true;
      btnStop.disabled = false;

      // シークバー表示・設定
      const posDisplay = document.getElementById('position-display');
      const startReal = performance.now();
      playbackStartReal = startReal;
      playbackStartOffset = seekOffset;

      animationTimer = setInterval(() => {
        const elapsed = (performance.now() - startReal) / 1000 + seekOffset;
        posDisplay.textContent = `${elapsed.toFixed(1)}s / ${currentTotalDuration.toFixed(1)}s`;
        // 可視化ヘッド更新
        updatePlayhead(elapsed);
      }, 100);

      stopTimerId = setTimeout(() => {
        if (isPlaying) stopPlayback();
      }, (totalDuration + 1.0) * 1000);
    }

    let stopTimerId = null;

    function stopPlayback() {
      isPlaying = false;
      if (stopTimerId) { clearTimeout(stopTimerId); stopTimerId = null; }
      if (schedulerTimer) { clearTimeout(schedulerTimer); schedulerTimer = null; }
      if (animationTimer) { clearInterval(animationTimer); animationTimer = null; }
      for (const osc of scheduledNodes) {
        try { osc.stop(); } catch {}
      }
      scheduledNodes = [];
      // チャンネルオーディオノードのクリーンアップ
      for (const ch of Object.keys(channelStates)) {
        channelStates[ch].gainNode = null;
        channelStates[ch].analyser = null;
      }
      if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
      btnPlay.disabled = false;
      btnStop.disabled = true;
      document.getElementById('position-display').textContent = '';
    }

    function playNotesFrom(notes, bpm, fromTime) {
      // fromTime以降のノートだけをオフセットして再生（元インデックス保持）
      const offsetNotes = notes
        .filter(n => (n.startTime + n.duration) > fromTime)
        .map(n => ({
          ...n,
          startTime: Math.max(0, n.startTime - fromTime),
          duration: n.startTime < fromTime ? n.duration - (fromTime - n.startTime) : n.duration
        }));
      playNotes(offsetNotes, bpm, fromTime);
    }

    // ============================================================
    // UI
    // ============================================================

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const btnPlay = document.getElementById('btn-play');
    const btnStop = document.getElementById('btn-stop');

    let currentNotes = [];
    let currentBpm = 120;
    let currentTotalDuration = 0;
    let playbackStartReal = 0;
    let playbackStartOffset = 0;

    // ドラッグ&ドロップ
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) loadFile(e.dataTransfer.files[0]);
    });
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) loadFile(fileInput.files[0]);
    });

    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          processMidi(e.target.result, file.name);
        } catch (err) {
          alert('MIDIパースエラー: ' + err.message);
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function processMidi(buffer, fileName) {
      stopPlayback();

      const parser = new MidiParser(buffer);
      const parsed = parser.parse();
      const { notes, tempo, bpm } = extractNotes(parsed);

      currentNotes = notes;
      currentBpm = bpm;

      // チャンネルごとの楽器情報を抽出
      channelPrograms = extractChannelPrograms(parsed);

      // チャンネル検出
      currentChannels = detectChannels(notes);

      // ヘッダー情報表示
      document.getElementById('info-format').textContent = `Type ${parsed.header.format}`;
      document.getElementById('info-tracks').textContent = parsed.header.numTracks;
      document.getElementById('info-division').textContent = parsed.header.timeDivision + ' ticks/beat';
      document.getElementById('info-tempo').textContent = `${bpm} BPM (${tempo} μs/beat)`;
      document.getElementById('info-notes').textContent = notes.length;
      // document.getElementById('header-info').style.display = 'block';

      // テンポ表示
      document.getElementById('tempo-display').textContent = `${bpm} BPM | ${fileName}`;

      // チャンネルUI構築
      buildChannelUI(currentChannels);
      document.getElementById('visualizer-section').style.display = 'block';

      // セクション表示
      document.getElementById('controls').style.display = 'flex';
      btnPlay.disabled = false;
      btnStop.disabled = true;

      // 全体の長さを事前計算
      currentTotalDuration = notes.length > 0
        ? Math.max(...notes.map(n => n.startTime + n.duration))
        : 0;

      // 可視化セクションを先に表示（Canvas描画にclientWidth必要）
      document.getElementById('piano-roll-section').style.display = 'block';

      // 描画（表示後に実行）
      requestAnimationFrame(() => {
        drawPianoRoll();
      });
    }

    // 再生コントロール
    btnPlay.addEventListener('click', () => playNotes(currentNotes, currentBpm));
    btnStop.addEventListener('click', () => stopPlayback());

    // ============================================================
    // ピアノロール描画
    // ============================================================

    function drawPianoRoll() {
      const canvas = document.getElementById('piano-roll-canvas');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.scale(dpr, dpr);
      const W = canvas.clientWidth;
      const H = canvas.clientHeight;

      ctx.clearRect(0, 0, W, H);
      if (!currentNotes.length) return;

      const dur = currentTotalDuration || Math.max(...currentNotes.map(n => n.startTime + n.duration));
      // 音域検出（パディング付き）
      let minNote = 127, maxNote = 0;
      for (const n of currentNotes) {
        if (n.note < minNote) minNote = n.note;
        if (n.note > maxNote) maxNote = n.note;
      }
      minNote = Math.max(0, minNote - 4);
      maxNote = Math.min(127, maxNote + 4);
      const noteRange = maxNote - minNote + 1;

      const plotW = W;
      const plotH = H;

      // ノート描画
      for (const n of currentNotes) {
        const isMuted = channelStates[n.channel]?.muted;
        const anySolo = Object.values(channelStates).some(s => s.soloed);
        const isSoloed = channelStates[n.channel]?.soloed;
        const hidden = anySolo ? !isSoloed : isMuted;

        const x = (n.startTime / dur) * plotW;
        const w = Math.max(1, (n.duration / dur) * plotW);
        const y = plotH - ((n.note - minNote + 1) / noteRange) * plotH;
        const h = Math.max(1, plotH / noteRange);

        const color = CHANNEL_COLORS[n.channel] || '#888';
        ctx.globalAlpha = hidden ? 0.15 : 0.85;
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
      }
      ctx.globalAlpha = 1;

      // Y軸ラベル（C音のみ）
      ctx.fillStyle = '#555';
      ctx.font = '9px monospace';
      for (let note = minNote; note <= maxNote; note++) {
        if (note % 12 === 0) {
          const y = plotH - ((note - minNote + 0.5) / noteRange) * plotH;
          ctx.fillText(`C${Math.floor(note / 12) - 1}`, 2, y + 3);
        }
      }
    }

    // ピアノロールクリックでシーク
    document.getElementById('piano-roll-canvas').addEventListener('click', (e) => {
      if (!currentNotes.length) return;
      const canvas = e.target;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const PADDING_LEFT = 0;
      const plotW = canvas.clientWidth - PADDING_LEFT;
      const ratio = (x - PADDING_LEFT) / plotW;
      if (ratio < 0 || ratio > 1) return;
      const seekTime = ratio * (currentTotalDuration || 1);
      stopPlayback();
      playNotesFrom(currentNotes, currentBpm, seekTime);
    });

    // (removed: drum roll, density graph, donut chart, velocity histogram)

    // ============================================================
    // 再生ヘッド統合更新
    // ============================================================

    function updatePlayhead(elapsed) {
      // ピアノロール再描画 + ヘッド
      const prCanvas = document.getElementById('piano-roll-canvas');
      if (prCanvas.clientWidth > 0) {
        drawPianoRoll();
        const ctx = prCanvas.getContext('2d');
        const W = prCanvas.clientWidth;
        const H = prCanvas.clientHeight;
        const PADDING_LEFT = 0;
        const plotW = W - PADDING_LEFT;
        const dur = currentTotalDuration || 1;
        const x = PADDING_LEFT + (elapsed / dur) * plotW;
        ctx.save();
        ctx.strokeStyle = '#ff4444';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
        ctx.restore();
      }
    }

  </script>
