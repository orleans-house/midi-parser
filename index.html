<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDI Parser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="piano-roll-section" class="viz-section">
    <canvas id="piano-roll-canvas" width="1200" height="300"></canvas>
  </div>

  <div id="main-container">
    <!-- 左カラム: コントロールパネル -->
    <div id="control-panel">
      <div class="panel-section">
        <button type="button" id="btn-open">📂 ファイルを開く</button>
        <input type="file" id="file-input" accept=".mid,.midi">
      </div>

      <div id="file-info" class="panel-section">
        <h3>📄 ファイル情報</h3>
        <table>
          <tr><td>ファイル</td><td id="info-filename">-</td></tr>
          <tr><td>フォーマット</td><td id="info-format">-</td></tr>
          <tr><td>トラック数</td><td id="info-tracks">-</td></tr>
          <tr><td>分解能</td><td id="info-division">-</td></tr>
          <tr><td>テンポ</td><td id="info-tempo">-</td></tr>
          <tr><td>ノート数</td><td id="info-notes">-</td></tr>
        </table>
      </div>

      <div id="playback-controls" class="panel-section">
        <h3>🎛️ コントロール</h3>
        <div class="control-row">
          <button type="button" id="btn-play" disabled>&#9654; 再生</button>
          <button type="button" id="btn-stop" disabled>&#9632; 停止</button>
        </div>
        <div class="control-row">
          <label for="wave-type">波形</label>
          <select id="wave-type">
            <option value="triangle">🔺 Triangle</option>
            <option value="sine">🔵 Sine</option>
            <option value="square">🟧 Square</option>
            <option value="sawtooth">🔶 Sawtooth</option>
          </select>
        </div>
        <div class="control-row">
          <label for="master-volume">音量</label>
          <input type="range" id="master-volume" min="0" max="100" value="50">
          <span id="volume-display">50%</span>
        </div>
      </div>

      <div id="position-info" class="panel-section">
        <span id="tempo-display">-</span>
        <span id="position-display"></span>
      </div>
    </div>

    <!-- 右カラム: チャンネル波形 -->
    <div id="visualizer-section">
      <div id="visualizer-container"></div>
    </div>
  </div>

  <div id="header-info" style="display:none;">
    <table>
      <tr><td>フォーマット</td><td id="info-format-legacy">-</td></tr>
    </table>
  </div>

  <div id="controls" style="display:none;"></div>

  <div id="drag-overlay">
    <div class="drag-overlay-content">🎵 ここにドロップ</div>
  </div>

  <script src="js/globals.js"></script>
  <script src="js/midi-parser.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/piano-roll.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
