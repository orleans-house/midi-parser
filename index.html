<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDI Parser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="piano-roll-section" class="viz-section">
    <canvas id="piano-roll-canvas" width="1200" height="300"></canvas>
  </div>

  <div id="main-container">
    <!-- 左カラム: コントロールパネル -->
    <div id="control-panel">
      <div class="panel-section">
        <button type="button" id="btn-open"><i data-lucide="folder-open"></i> ファイルを開く</button>
        <input type="file" id="file-input" accept=".mid,.midi">
      </div>

      <div id="file-info" class="panel-section">
        <h3><i data-lucide="file-audio"></i> ファイル情報</h3>
        <table>
          <tr><td>File</td><td id="info-filename">-</td></tr>
          <tr><td>Format</td><td id="info-format">-</td></tr>
          <tr><td>Tracks</td><td id="info-tracks">-</td></tr>
          <tr><td>Div</td><td id="info-division">-</td></tr>
          <tr><td>Tempo</td><td id="info-tempo">-</td></tr>
          <tr><td>Notes</td><td id="info-notes">-</td></tr>
        </table>
      </div>

      <div id="playback-controls" class="panel-section">
        <h3><i data-lucide="sliders-horizontal"></i> コントロール</h3>
        <div class="control-row">
          <button type="button" id="btn-play" disabled><i data-lucide="play"></i> 再生</button>
          <button type="button" id="btn-stop" disabled><i data-lucide="square"></i> 停止</button>
        </div>
        <div id="wave-mixer">
          <div class="mixer-channel mixer-master">
            <span class="mixer-pct" id="master-vol-pct">100%</span>
            <input type="range" class="mixer-vol" id="master-volume" min="0" max="100" value="100" orient="vertical">
            <span class="master-icon"><i data-lucide="volume-2"></i></span>
            <span class="mixer-label">Master</span>
          </div>
          <div class="mixer-divider"></div>
          <div class="mixer-channel" data-wave="triangle">
            <span class="mixer-pct">50%</span>
            <input type="range" class="mixer-vol" min="0" max="100" value="50" orient="vertical">
            <button type="button" class="mixer-btn active"><svg class="wave-icon" role="img" aria-hidden="true" viewBox="0 0 24 16"><polyline points="0,12 6,4 12,12 18,4 24,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/></svg></button>
            <span class="mixer-label">Tri</span>
          </div>
          <div class="mixer-channel" data-wave="sine">
            <span class="mixer-pct">50%</span>
            <input type="range" class="mixer-vol" min="0" max="100" value="50" orient="vertical">
            <button type="button" class="mixer-btn"><svg class="wave-icon" role="img" aria-hidden="true" viewBox="0 0 24 16"><path d="M0,8 C3,2 6,2 8,8 C10,14 13,14 16,8 C18,2 21,2 24,8" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
            <span class="mixer-label">Sin</span>
          </div>
          <div class="mixer-channel" data-wave="square">
            <span class="mixer-pct">20%</span>
            <input type="range" class="mixer-vol" min="0" max="100" value="20" orient="vertical">
            <button type="button" class="mixer-btn"><svg class="wave-icon" role="img" aria-hidden="true" viewBox="0 0 24 16"><polyline points="0,12 0,4 6,4 6,12 12,12 12,4 18,4 18,12 24,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/></svg></button>
            <span class="mixer-label">Sq</span>
          </div>
          <div class="mixer-channel" data-wave="sawtooth">
            <span class="mixer-pct">24%</span>
            <input type="range" class="mixer-vol" min="0" max="100" value="24" orient="vertical">
            <button type="button" class="mixer-btn"><svg class="wave-icon" role="img" aria-hidden="true" viewBox="0 0 24 16"><polyline points="0,12 12,4 12,12 24,4 24,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/></svg></button>
            <span class="mixer-label">Saw</span>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <h3><i data-lucide="sliders-vertical"></i> イコライザー</h3>
        <div id="eq-mixer">
          <div class="eq-band" data-freq="60">
            <span class="eq-val">0</span>
            <input type="range" class="eq-slider" min="-12" max="12" value="0" orient="vertical">
            <span class="eq-label">60</span>
          </div>
          <div class="eq-band" data-freq="250">
            <span class="eq-val">0</span>
            <input type="range" class="eq-slider" min="-12" max="12" value="0" orient="vertical">
            <span class="eq-label">250</span>
          </div>
          <div class="eq-band" data-freq="1000">
            <span class="eq-val">0</span>
            <input type="range" class="eq-slider" min="-12" max="12" value="0" orient="vertical">
            <span class="eq-label">1k</span>
          </div>
          <div class="eq-band" data-freq="4000">
            <span class="eq-val">0</span>
            <input type="range" class="eq-slider" min="-12" max="12" value="0" orient="vertical">
            <span class="eq-label">4k</span>
          </div>
          <div class="eq-band" data-freq="12000">
            <span class="eq-val">0</span>
            <input type="range" class="eq-slider" min="-12" max="12" value="0" orient="vertical">
            <span class="eq-label">12k</span>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <h3><i data-lucide="activity"></i> スペクトラム</h3>
        <canvas id="spectrum-canvas" height="100" style="width:100%; border-radius:4px; background:var(--bg-canvas); display:block; cursor:crosshair;"></canvas>
        <div id="filter-controls" style="margin-top:6px;">
          <div class="fx-row">
            <label class="fx-toggle">
              <input type="checkbox" id="filter-enabled">
              <span>Filter</span>
            </label>
            <select id="filter-type" style="font-size:0.7rem;" disabled>
              <option value="lowpass">Lowpass</option>
              <option value="highpass">Highpass</option>
              <option value="bandpass">Bandpass</option>
              <option value="notch">Notch</option>
            </select>
          </div>
          <div class="fx-row">
            <span class="fx-val" style="min-width:28px">Freq</span>
            <input type="range" id="filter-freq" class="fx-slider" min="0" max="100" value="50" disabled>
            <span class="fx-val" id="filter-freq-val">1000</span>
          </div>
          <div class="fx-row">
            <span class="fx-val" style="min-width:28px">Q</span>
            <input type="range" id="filter-q" class="fx-slider" min="0.1" max="20" value="1" step="0.1" disabled>
            <span class="fx-val" id="filter-q-val">1.0</span>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <h3><i data-lucide="zap"></i> エフェクト</h3>
        <div id="fx-controls">
          <div class="fx-row">
            <label class="fx-toggle">
              <input type="checkbox" id="fx-distortion-on">
              <span>Distortion</span>
            </label>
            <input type="range" id="fx-distortion" class="fx-slider" min="0" max="100" value="50" disabled>
            <span class="fx-val" id="fx-distortion-val">50</span>
          </div>
          <div class="fx-row">
            <label class="fx-toggle">
              <input type="checkbox" id="fx-delay-on">
              <span>Delay</span>
            </label>
            <input type="range" id="fx-delay-time" class="fx-slider" min="50" max="800" value="300" disabled>
            <span class="fx-val" id="fx-delay-val">300ms</span>
          </div>
          <div class="fx-row">
            <label class="fx-toggle">
              <input type="checkbox" id="fx-reverb-on">
              <span>Reverb</span>
            </label>
            <input type="range" id="fx-reverb" class="fx-slider" min="0" max="100" value="40" disabled>
            <span class="fx-val" id="fx-reverb-val">40</span>
          </div>
          <div class="fx-row fx-trim-row">
            <label class="fx-toggle">
              <span><i data-lucide="gauge"></i> Trim</span>
            </label>
            <input type="range" id="fx-trim" class="fx-slider" min="0" max="100" value="80">
            <span class="fx-val" id="fx-trim-val">80%</span>
          </div>
        </div>
      </div>

      <div id="position-info" class="panel-section">
        <span id="position-display"></span>
      </div>
    </div>

    <!-- 右カラム: チャンネル波形 -->
    <div id="visualizer-section">
      <div id="visualizer-container"></div>
    </div>
  </div>

  <select id="wave-type" style="display:none;">
    <option value="triangle" selected>Triangle</option>
    <option value="sine">Sine</option>
    <option value="square">Square</option>
    <option value="sawtooth">Sawtooth</option>
  </select>

  <div id="header-info" style="display:none;">
    <table>
      <tr><td>フォーマット</td><td id="info-format-legacy">-</td></tr>
    </table>
  </div>

  <div id="controls" style="display:none;"></div>

  <div id="drag-overlay">
    <div class="drag-overlay-content"><i data-lucide="music"></i> ここにドロップ</div>
  </div>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
  <script src="js/globals.js"></script>
  <script src="js/midi-parser.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/piano-roll.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
