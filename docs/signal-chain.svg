<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#b39ddb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#81c784"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4dd0e1"/>
    </marker>
  </defs>

  <rect width="960" height="500" rx="12" fill="#0e0a14"/>

  <!-- Source Layer -->
  <rect x="20" y="20" width="160" height="400" rx="8" fill="#1a1525" stroke="#5a4d70" stroke-width="1.5"/>
  <text x="100" y="45" text-anchor="middle" fill="#b39ddb" font-weight="bold" font-size="14">Source</text>
  <text x="100" y="62" text-anchor="middle" fill="#7a6d90" font-size="11">audio-source.js</text>

  <rect x="35" y="80" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="100" y="100" text-anchor="middle" fill="#e0d6f0">Oscillator</text>
  <line x1="100" y1="110" x2="100" y2="130" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="35" y="130" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="100" y="150" text-anchor="middle" fill="#e0d6f0">Envelope</text>

  <!-- Metronome inside Source -->
  <rect x="35" y="370" width="130" height="30" rx="6" fill="#2e2440" stroke="#81c784"/>
  <text x="100" y="390" text-anchor="middle" fill="#81c784">Metronome</text>

  <!-- Channel Layer -->
  <rect x="195" y="20" width="160" height="400" rx="8" fill="#1a1525" stroke="#5a4d70" stroke-width="1.5"/>
  <text x="275" y="45" text-anchor="middle" fill="#b39ddb" font-weight="bold" font-size="14">Channel x16</text>
  <text x="275" y="62" text-anchor="middle" fill="#7a6d90" font-size="11">audio-channel.js</text>

  <rect x="210" y="80" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="275" y="100" text-anchor="middle" fill="#e0d6f0">ChGain</text>
  <text x="275" y="120" text-anchor="middle" fill="#7a6d90" font-size="10">waveVol x playGate</text>
  <line x1="275" y1="110" x2="275" y2="135" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="135" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="275" y="155" text-anchor="middle" fill="#e0d6f0">Distortion</text>
  <line x1="275" y1="165" x2="275" y2="185" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="185" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="275" y="205" text-anchor="middle" fill="#e0d6f0">Delay</text>
  <line x1="275" y1="215" x2="275" y2="235" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="235" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="275" y="255" text-anchor="middle" fill="#e0d6f0">Reverb</text>
  <line x1="275" y1="265" x2="275" y2="285" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="285" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="275" y="305" text-anchor="middle" fill="#e0d6f0">ChAnalyser</text>

  <!-- Master Layer -->
  <rect x="370" y="20" width="310" height="400" rx="8" fill="#1a1525" stroke="#5a4d70" stroke-width="1.5"/>
  <text x="525" y="45" text-anchor="middle" fill="#b39ddb" font-weight="bold" font-size="14">Master</text>
  <text x="525" y="62" text-anchor="middle" fill="#7a6d90" font-size="11">audio-master.js</text>

  <rect x="460" y="80" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="525" y="100" text-anchor="middle" fill="#e0d6f0">MasterGain</text>
  <line x1="525" y1="110" x2="525" y2="130" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="460" y="130" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="525" y="150" text-anchor="middle" fill="#e0d6f0">GlobalFilter</text>
  <line x1="525" y1="160" x2="525" y2="180" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="460" y="180" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="525" y="200" text-anchor="middle" fill="#e0d6f0">EQ 5-band</text>
  <line x1="525" y1="210" x2="525" y2="230" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="460" y="230" width="130" height="30" rx="6" fill="#2e2440" stroke="#b39ddb" stroke-width="2"/>
  <text x="525" y="250" text-anchor="middle" fill="#b39ddb" font-weight="bold">FX Trim</text>

  <!-- FX Trim splits to Spectrum and MasterAnalyser -->
  <line x1="490" y1="260" x2="440" y2="290" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="260" x2="610" y2="290" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="390" y="290" width="110" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="445" y="310" text-anchor="middle" fill="#e0d6f0" font-size="12">Spectrum</text>

  <rect x="560" y="290" width="110" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="615" y="310" text-anchor="middle" fill="#e0d6f0" font-size="12">MasterAnalyser</text>

  <!-- User Layer -->
  <rect x="700" y="20" width="240" height="400" rx="8" fill="#1a1525" stroke="#81c784" stroke-width="1.5"/>
  <text x="820" y="45" text-anchor="middle" fill="#81c784" font-weight="bold" font-size="14">User</text>
  <text x="820" y="62" text-anchor="middle" fill="#7a6d90" font-size="11">audio-output.js</text>

  <!-- Waveform Renderer -->
  <rect x="730" y="90" width="180" height="60" rx="8" fill="#1e2a30" stroke="#4dd0e1" stroke-width="1.5"/>
  <text x="820" y="115" text-anchor="middle" fill="#4dd0e1" font-weight="bold" font-size="13">Waveform Renderer</text>
  <text x="820" y="135" text-anchor="middle" fill="#7a6d90" font-size="11">Canvas (60fps)</text>

  <!-- destination -->
  <rect x="730" y="340" width="180" height="50" rx="8" fill="#1e2a30" stroke="#81c784" stroke-width="2"/>
  <text x="820" y="365" text-anchor="middle" fill="#81c784" font-weight="bold" font-size="14">destination</text>
  <text x="820" y="382" text-anchor="middle" fill="#7a6d90" font-size="10">Speaker output</text>

  <!-- === Audio connections (purple solid) === -->
  <!-- Source Envelope → Channel ChGain -->
  <line x1="165" y1="145" x2="210" y2="95" stroke="#b39ddb" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Channel ChAnalyser → Master MasterGain -->
  <line x1="340" y1="295" x2="460" y2="95" stroke="#b39ddb" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- MasterAnalyser → User destination -->
  <line x1="670" y1="305" x2="730" y2="355" stroke="#b39ddb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- === Metronome path (green dashed) === -->
  <path d="M165,385 L700,385 L730,365" fill="none" stroke="#81c784" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow-green)"/>

  <!-- === Visual data (cyan dashed) === -->
  <!-- ChAnalyser → Renderer (curve above to avoid crossing audio lines) -->
  <path d="M340,290 C450,250 650,70 730,110" fill="none" stroke="#4dd0e1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-cyan)"/>
  <!-- Spectrum → Renderer (straight, below ChAnalyser line) -->
  <path d="M500,300 C550,270 680,160 730,125" fill="none" stroke="#4dd0e1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-cyan)"/>
  <!-- MasterAnalyser → Renderer (curve below) -->
  <path d="M670,300 C700,250 720,180 730,140" fill="none" stroke="#4dd0e1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-cyan)"/>

  <!-- Legend -->
  <rect x="230" y="445" width="500" height="40" rx="6" fill="#1a1525" stroke="#5a4d70" stroke-width="0.5"/>
  <line x1="250" y1="465" x2="290" y2="465" stroke="#b39ddb" stroke-width="2"/>
  <text x="300" y="469" fill="#7a6d90" font-size="11">Audio</text>
  <line x1="350" y1="465" x2="390" y2="465" stroke="#81c784" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="469" fill="#7a6d90" font-size="11">Metronome</text>
  <line x1="480" y1="465" x2="520" y2="465" stroke="#4dd0e1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="530" y="469" fill="#7a6d90" font-size="11">Visual data</text>
  <text x="480" y="480" text-anchor="middle" fill="#5a4d70" font-size="9">Orchestrator: audio-engine.js</text>
</svg>
