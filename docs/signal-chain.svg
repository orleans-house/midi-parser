<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#b39ddb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#81c784"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="12" fill="#0e0a14"/>

  <!-- Source Layer -->
  <rect x="20" y="20" width="180" height="200" rx="8" fill="#1a1525" stroke="#5a4d70" stroke-width="1.5"/>
  <text x="110" y="45" text-anchor="middle" fill="#b39ddb" font-weight="bold" font-size="14">🎵 Source</text>
  <text x="110" y="62" text-anchor="middle" fill="#7a6d90" font-size="11">audio-source.js</text>
  <rect x="45" y="75" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="110" y="95" text-anchor="middle" fill="#e0d6f0">Oscillator</text>
  <rect x="45" y="120" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="110" y="140" text-anchor="middle" fill="#e0d6f0">Envelope</text>
  <line x1="110" y1="105" x2="110" y2="120" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Metronome (separate path) -->
  <rect x="45" y="165" width="130" height="30" rx="6" fill="#2e2440" stroke="#81c784"/>
  <text x="110" y="185" text-anchor="middle" fill="#81c784">🥁 Metronome</text>

  <!-- Channel Layer -->
  <rect x="220" y="20" width="180" height="290" rx="8" fill="#1a1525" stroke="#5a4d70" stroke-width="1.5"/>
  <text x="310" y="45" text-anchor="middle" fill="#b39ddb" font-weight="bold" font-size="14">🔀 Channel ×16</text>
  <text x="310" y="62" text-anchor="middle" fill="#7a6d90" font-size="11">audio-channel.js</text>
  <rect x="245" y="75" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="310" y="95" text-anchor="middle" fill="#e0d6f0">ChGain</text>
  <text x="310" y="110" text-anchor="middle" fill="#7a6d90" font-size="10">waveVol × playGate</text>
  <rect x="245" y="125" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="310" y="145" text-anchor="middle" fill="#e0d6f0">Distortion</text>
  <rect x="245" y="170" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="310" y="190" text-anchor="middle" fill="#e0d6f0">Delay</text>
  <rect x="245" y="215" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="310" y="235" text-anchor="middle" fill="#e0d6f0">Reverb</text>
  <rect x="245" y="260" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="310" y="280" text-anchor="middle" fill="#e0d6f0">ChAnalyser</text>
  <line x1="310" y1="105" x2="310" y2="125" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="155" x2="310" y2="170" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="200" x2="310" y2="215" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="245" x2="310" y2="260" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Master Layer -->
  <rect x="420" y="20" width="340" height="370" rx="8" fill="#1a1525" stroke="#5a4d70" stroke-width="1.5"/>
  <text x="590" y="45" text-anchor="middle" fill="#b39ddb" font-weight="bold" font-size="14">🎛️ Master</text>
  <text x="590" y="62" text-anchor="middle" fill="#7a6d90" font-size="11">audio-master.js</text>
  <rect x="525" y="75" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="590" y="95" text-anchor="middle" fill="#e0d6f0">MasterGain</text>
  <rect x="525" y="120" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="590" y="140" text-anchor="middle" fill="#e0d6f0">GlobalFilter</text>
  <rect x="525" y="165" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="590" y="185" text-anchor="middle" fill="#e0d6f0">EQ 5-band</text>
  <line x1="590" y1="105" x2="590" y2="120" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="150" x2="590" y2="165" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3-way split from EQ -->
  <rect x="440" y="220" width="110" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="495" y="240" text-anchor="middle" fill="#e0d6f0">Distortion</text>
  <rect x="560" y="220" width="80" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="600" y="240" text-anchor="middle" fill="#e0d6f0">Delay</text>
  <rect x="650" y="220" width="90" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="695" y="240" text-anchor="middle" fill="#e0d6f0">Reverb</text>

  <!-- EQ to 3-way -->
  <line x1="555" y1="195" x2="495" y2="220" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="195" x2="600" y2="220" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="625" y1="195" x2="695" y2="220" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FX Trim -->
  <rect x="525" y="275" width="130" height="30" rx="6" fill="#2e2440" stroke="#b39ddb"/>
  <text x="590" y="295" text-anchor="middle" fill="#b39ddb" font-weight="bold">FX Trim</text>
  <line x1="495" y1="250" x2="560" y2="275" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="250" x2="590" y2="275" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="695" y1="250" x2="625" y2="275" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output Layer -->
  <rect x="780" y="20" width="160" height="290" rx="8" fill="#1a1525" stroke="#5a4d70" stroke-width="1.5"/>
  <text x="860" y="45" text-anchor="middle" fill="#b39ddb" font-weight="bold" font-size="14">🔊 Output</text>
  <text x="860" y="62" text-anchor="middle" fill="#7a6d90" font-size="11">audio-output.js</text>
  <rect x="800" y="85" width="120" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="860" y="105" text-anchor="middle" fill="#e0d6f0">Spectrum</text>
  <text x="860" y="120" text-anchor="middle" fill="#7a6d90" font-size="10">visual only</text>
  <rect x="800" y="145" width="120" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="860" y="165" text-anchor="middle" fill="#e0d6f0">MasterAnalyser</text>
  <rect x="800" y="235" width="120" height="30" rx="6" fill="#2e2440" stroke="#81c784" stroke-width="2"/>
  <text x="860" y="255" text-anchor="middle" fill="#81c784" font-weight="bold">🔊 destination</text>
  <line x1="860" y1="175" x2="860" y2="235" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Inter-layer connections -->
  <!-- Source → Channel -->
  <line x1="175" y1="135" x2="245" y2="90" stroke="#b39ddb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Channel → Master -->
  <line x1="375" y1="275" x2="525" y2="90" stroke="#b39ddb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Master → Output (FX Trim splits) -->
  <line x1="655" y1="290" x2="800" y2="100" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="655" y1="290" x2="800" y2="160" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Metronome → destination (green path) -->
  <path d="M175,180 Q480,480 800,250" fill="none" stroke="#81c784" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>

  <!-- Layer flow labels -->
  <text x="205" y="500" text-anchor="middle" fill="#5a4d70" font-size="11">audio-source.js</text>
  <text x="405" y="500" text-anchor="middle" fill="#5a4d70" font-size="11">audio-channel.js</text>
  <text x="605" y="500" text-anchor="middle" fill="#5a4d70" font-size="11">audio-master.js</text>
  <text x="860" y="500" text-anchor="middle" fill="#5a4d70" font-size="11">audio-output.js</text>

  <!-- Legend -->
  <rect x="420" y="410" width="340" height="80" rx="6" fill="#1a1525" stroke="#5a4d70" stroke-width="0.5"/>
  <line x1="440" y1="435" x2="480" y2="435" stroke="#b39ddb" stroke-width="2"/>
  <text x="490" y="439" fill="#7a6d90" font-size="11">Audio signal path</text>
  <line x1="440" y1="460" x2="480" y2="460" stroke="#81c784" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="490" y="464" fill="#7a6d90" font-size="11">Metronome (independent path)</text>
  <text x="440" y="482" fill="#5a4d70" font-size="10">Orchestrator: audio-engine.js</text>
</svg>
