<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#b39ddb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#81c784"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="12" fill="#0e0a14"/>

  <!-- Common dimensions: layers y=20, height=350 -->

  <!-- Source Layer -->
  <rect x="20" y="20" width="180" height="350" rx="8" fill="#1a1525" stroke="#5a4d70" stroke-width="1.5"/>
  <text x="110" y="45" text-anchor="middle" fill="#b39ddb" font-weight="bold" font-size="14">🎵 Source</text>
  <text x="110" y="62" text-anchor="middle" fill="#7a6d90" font-size="11">audio-source.js</text>
  <rect x="40" y="80" width="140" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="110" y="100" text-anchor="middle" fill="#e0d6f0">Oscillator</text>
  <line x1="110" y1="110" x2="110" y2="130" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="130" width="140" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="110" y="150" text-anchor="middle" fill="#e0d6f0">Envelope</text>

  <!-- Channel Layer -->
  <rect x="220" y="20" width="180" height="350" rx="8" fill="#1a1525" stroke="#5a4d70" stroke-width="1.5"/>
  <text x="310" y="45" text-anchor="middle" fill="#b39ddb" font-weight="bold" font-size="14">🔀 Channel ×16</text>
  <text x="310" y="62" text-anchor="middle" fill="#7a6d90" font-size="11">audio-channel.js</text>
  <rect x="240" y="80" width="140" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="310" y="100" text-anchor="middle" fill="#e0d6f0">ChGain</text>
  <text x="310" y="120" text-anchor="middle" fill="#7a6d90" font-size="10">waveVol × playGate</text>
  <line x1="310" y1="110" x2="310" y2="135" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="240" y="135" width="140" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="310" y="155" text-anchor="middle" fill="#e0d6f0">Distortion</text>
  <line x1="310" y1="165" x2="310" y2="180" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="240" y="180" width="140" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="310" y="200" text-anchor="middle" fill="#e0d6f0">Delay</text>
  <line x1="310" y1="210" x2="310" y2="225" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="240" y="225" width="140" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="310" y="245" text-anchor="middle" fill="#e0d6f0">Reverb</text>
  <line x1="310" y1="255" x2="310" y2="270" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="240" y="270" width="140" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="310" y="290" text-anchor="middle" fill="#e0d6f0">ChAnalyser</text>

  <!-- Master Layer -->
  <rect x="420" y="20" width="340" height="350" rx="8" fill="#1a1525" stroke="#5a4d70" stroke-width="1.5"/>
  <text x="590" y="45" text-anchor="middle" fill="#b39ddb" font-weight="bold" font-size="14">🎛️ Master</text>
  <text x="590" y="62" text-anchor="middle" fill="#7a6d90" font-size="11">audio-master.js</text>
  <rect x="525" y="80" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="590" y="100" text-anchor="middle" fill="#e0d6f0">MasterGain</text>
  <line x1="590" y1="110" x2="590" y2="125" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="525" y="125" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="590" y="145" text-anchor="middle" fill="#e0d6f0">GlobalFilter</text>
  <line x1="590" y1="155" x2="590" y2="170" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="525" y="170" width="130" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="590" y="190" text-anchor="middle" fill="#e0d6f0">EQ 5-band</text>

  <!-- 3-way split -->
  <line x1="545" y1="200" x2="490" y2="220" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="200" x2="590" y2="220" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="635" y1="200" x2="690" y2="220" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="220" width="100" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="490" y="240" text-anchor="middle" fill="#e0d6f0">Distortion</text>
  <rect x="550" y="220" width="80" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="590" y="240" text-anchor="middle" fill="#e0d6f0">Delay</text>
  <rect x="640" y="220" width="100" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="690" y="240" text-anchor="middle" fill="#e0d6f0">Reverb</text>

  <!-- Converge to FX Trim -->
  <line x1="490" y1="250" x2="555" y2="280" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="250" x2="590" y2="280" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="250" x2="625" y2="280" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="525" y="280" width="130" height="30" rx="6" fill="#2e2440" stroke="#b39ddb" stroke-width="2"/>
  <text x="590" y="300" text-anchor="middle" fill="#b39ddb" font-weight="bold">FX Trim</text>

  <!-- Output Layer -->
  <rect x="780" y="20" width="160" height="350" rx="8" fill="#1a1525" stroke="#5a4d70" stroke-width="1.5"/>
  <text x="860" y="45" text-anchor="middle" fill="#b39ddb" font-weight="bold" font-size="14">🔊 Output</text>
  <text x="860" y="62" text-anchor="middle" fill="#7a6d90" font-size="11">audio-output.js</text>
  <rect x="800" y="80" width="120" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="860" y="100" text-anchor="middle" fill="#e0d6f0">Spectrum</text>
  <text x="860" y="120" text-anchor="middle" fill="#7a6d90" font-size="10">visual only</text>
  <line x1="860" y1="110" x2="860" y2="135" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="800" y="135" width="120" height="30" rx="6" fill="#2e2440" stroke="#5a4d70"/>
  <text x="860" y="155" text-anchor="middle" fill="#e0d6f0">MasterAnalyser</text>

  <!-- Inter-layer connections -->
  <!-- Source → Channel -->
  <line x1="180" y1="145" x2="240" y2="95" stroke="#b39ddb" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Channel → Master -->
  <line x1="380" y1="285" x2="525" y2="95" stroke="#b39ddb" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- FX Trim → Spectrum -->
  <line x1="655" y1="290" x2="800" y2="95" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- FX Trim → MasterAnalyser -->
  <line x1="655" y1="295" x2="800" y2="150" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom bar: Metronome → destination -->
  <rect x="20" y="400" width="920" height="60" rx="8" fill="#1a1525" stroke="#5a4d70" stroke-width="1"/>

  <rect x="60" y="415" width="140" height="30" rx="6" fill="#2e2440" stroke="#81c784"/>
  <text x="130" y="435" text-anchor="middle" fill="#81c784">🥁 Metronome</text>

  <rect x="800" y="415" width="120" height="30" rx="6" fill="#2e2440" stroke="#81c784" stroke-width="2"/>
  <text x="860" y="435" text-anchor="middle" fill="#81c784" font-weight="bold">🔊 destination</text>

  <!-- Metronome → destination straight line -->
  <line x1="200" y1="430" x2="800" y2="430" stroke="#81c784" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow-green)"/>

  <!-- MasterAnalyser → destination -->
  <line x1="860" y1="165" x2="860" y2="415" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="300" y="480" width="360" height="50" rx="6" fill="#1a1525" stroke="#5a4d70" stroke-width="0.5"/>
  <line x1="320" y1="500" x2="360" y2="500" stroke="#b39ddb" stroke-width="2"/>
  <text x="370" y="504" fill="#7a6d90" font-size="11">Audio signal path</text>
  <line x1="530" y1="500" x2="570" y2="500" stroke="#81c784" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="580" y="504" fill="#7a6d90" font-size="11">Metronome path</text>
  <text x="480" y="522" text-anchor="middle" fill="#5a4d70" font-size="10">Orchestrator: audio-engine.js</text>
</svg>
